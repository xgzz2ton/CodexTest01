<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじ</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="scene">
    <main class="card" id="card">
      <header>
        <h1>おみくじ</h1>
        <p class="subtitle">ボタンを押して今日の運勢を占おう</p>
      </header>

      <div class="button-row">
        <button id="draw" type="button">おみくじを引く</button>
      </div>

      <div class="result">
        <p class="fortune-name" id="fortune-name">まだ引いていません</p>
        <p class="message" id="fortune-message">ボタンを押すと結果が表示されます。</p>
      </div>

      <p class="note">
        サイコロ式で引きたい場合は
        <a class="inline-link" href="./omikuji-dice.html">omikuji-dice</a>
      </p>
    </main>
    <div class="particles" id="particles"></div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
