<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじサイコロ</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="scene">
    <main class="card" id="card">
      <header>
        <h1>おみくじサイコロ</h1>
        <p class="subtitle">1-100の乱数で運勢を判定します</p>
      </header>

      <section class="dice">
        <p class="roll-label">今回の出目</p>
        <div class="roll-number" id="roll-number">--</div>
        <p class="roll-label">1 - 100</p>
      </section>

      <div class="button-row">
        <button id="draw" type="button">サイコロを振る</button>
      </div>

      <div class="result">
        <p class="fortune-name" id="fortune-name">まだ引いていません</p>
        <p class="message" id="fortune-message">ボタンを押すと結果が表示されます。</p>
      </div>

      <p class="note">
        ランダム抽選版に戻る:
        <a class="inline-link" href="./index.html">index</a>
      </p>
    </main>
    <div class="particles" id="particles"></div>
  </div>

  <script src="./omikuji-dice.js"></script>
</body>
</html>
